name: Deploy zu GitHub Pages

# Statische Seite ohne Build-Schritt auf GitHub Pages veröffentlichen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen (gesamtes Repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
